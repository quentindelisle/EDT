<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>EDT EPS</title>
<style>
:root{
  --bg:#f4f3f0;--surf:#fff;--brd:#e0ddd5;--brd2:#c4c0b5;
  --txt:#1a1917;--mut:#6b6860;--fnt:#aaa;
  --vac:#d0cec7;--hdr:#23221f;--hdr2:#2e2d29;--htxt:#f0ede8;
  --RH:48px;--WW:29px;--LW:185px;--GRIDW:1470px;
  --accent:#fcd34d;
  --gt-row:#e0f2fe;--gt-cell:#f0f9ff;--gt-brd:#38bdf8;
  --pro-row:#ffedd5;--pro-cell:#fff7ed;--pro-brd:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:12px}
body.compact,body.comfort{--RH:48px;--WW:29px;--LW:185px;--GRIDW:1470px;font-size:12px}
body.has-selection td.td-w.editable{cursor:crosshair}
body.role-mode td.td-w[data-has-cyc="1"]{cursor:pointer;outline:2px solid rgba(252,211,77,.8);outline-offset:-2px;box-shadow:inset 0 0 0 999px rgba(252,211,77,.08)}

/* TOPBAR */
#topbar{background:var(--hdr);color:var(--htxt);padding:3px 10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;position:sticky;top:0;z-index:400;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#topbar h1{font-size:13px;font-weight:800;white-space:nowrap;letter-spacing:.02em}
#topbar .app-logo{width:28px;height:28px;border-radius:8px;object-fit:cover;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.22);flex-shrink:0}
#topbar h1{display:flex;align-items:center;gap:7px}
#installPwaBtn{border-color:rgba(14,165,233,.4);color:#7dd3fc}
@media (display-mode:standalone){#installPwaBtn{display:none!important}}

.sep{width:1px;height:17px;background:rgba(255,255,255,.12);flex-shrink:0}
.tbtn{padding:2px 8px;border-radius:3px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--htxt);font-size:10px;font-weight:500;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.18)}
.tbtn.g{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.1);color:#86efac}
.tbtn.r{border-color:rgba(248,113,113,.3);color:#fca5a5}
.tbtn.v{border-color:rgba(200,180,255,.4);color:#d8b4fe}
#ss{font-size:9px;color:rgba(255,255,255,.35)}
.version-tag{font-size:9px;font-weight:600;color:rgba(255,255,255,.45);margin-left:5px}
.tbtn.on{background:rgba(252,211,77,.18);border-color:rgba(252,211,77,.55);color:#fde68a}
.helpbar{background:#fff7d6;border-bottom:1px solid #e8d47a;color:#4f4212;padding:6px 12px;font-size:11px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.helpbar.closed{display:none}
.helpbar b{font-weight:700}.kbd{display:inline-block;border:1px solid rgba(0,0,0,.18);border-bottom-width:2px;background:rgba(255,255,255,.75);border-radius:3px;padding:0 4px;font-size:9px;font-weight:700;margin:0 2px}
.helpitem{white-space:nowrap}

/* PALETTE */
#palbar{background:var(--hdr2);border-bottom:1px solid rgba(0,0,0,.2);position:sticky;top:31px;z-index:390;overflow:hidden;transition:max-height .22s ease;max-height:200px}
#palbar.closed{max-height:0;border-bottom:none}
#palbody{padding:3px 10px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.selbox{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 6px}
.selbox-label{font-size:8px;color:rgba(255,255,255,.48);text-transform:uppercase;letter-spacing:.04em}
.cagrp{display:flex;align-items:center;gap:2px;border-left:2px solid;padding-left:5px;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:2px;padding:1px 4px 1px 2px;border-radius:7px;font-size:8px;font-weight:650;cursor:pointer;border:2px solid transparent;line-height:1.15;white-space:nowrap;min-height:18px}
.chip:hover{filter:brightness(1.1)}
.chip.on{border-color:#fff;box-shadow:0 0 0 2px rgba(252,211,77,.65),0 0 14px rgba(252,211,77,.35);transform:translateY(-1px)}
.chip-ico{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.28);font-size:9px;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.chip-name{max-width:72px;overflow:hidden;text-overflow:ellipsis}
.chip-ca{font-size:6px;font-weight:800;padding:1px 2px;border-radius:2px;background:rgba(0,0,0,.25);color:#fff}
.chip-loc{font-size:6px;font-weight:800;padding:1px 2px;border-radius:2px;background:rgba(255,255,255,.22);color:#fff;margin-left:1px}
.addform{display:flex;gap:3px;align-items:center;margin-left:auto;flex:0 0 auto}
.addform input[type=text]{padding:2px 5px;border-radius:3px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:9px;width:78px}
.addform input[type=text]::placeholder{color:rgba(255,255,255,.35)}
.addform select{padding:2px 3px;border-radius:3px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:10px}
.addform select option{background:#2e2d29}
.addform input[type=color]{width:20px;height:20px;border-radius:2px;border:none;cursor:pointer;background:transparent;padding:1px}
#selinfo{font-size:10px;font-weight:800;color:var(--accent);min-width:118px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}.selico{width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(252,211,77,.16);border:1px solid rgba(252,211,77,.35);font-size:11px}
.legend-mini{display:flex;align-items:center;gap:3px;flex-wrap:wrap;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:6px;padding:3px 5px}
.legend-title{font-size:8px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.05em}
.legchip{font-size:7px;font-weight:900;color:#fff;border-radius:4px;padding:2px 4px;line-height:1}
.clear-sel{font-size:9px;border:none;background:rgba(255,255,255,.12);color:rgba(255,255,255,.75);border-radius:4px;padding:2px 6px;cursor:pointer}.clear-sel:hover{background:rgba(255,255,255,.2);color:#fff}
#pal{display:flex;gap:2px 3px;flex-wrap:wrap;align-items:center;flex:1 1 auto}
#pal-installs{display:flex;gap:2px 3px;flex-wrap:wrap;align-items:center}
.install-chip{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:7px;font-size:8px;font-weight:800;cursor:pointer;border:2px solid transparent;line-height:1.3;white-space:nowrap;min-height:18px}
.install-chip:hover{filter:brightness(1.12)}
.install-chip.on{border-color:#fff;box-shadow:0 0 0 2px rgba(252,211,77,.65);transform:translateY(-1px)}
.chip-del{margin-left:3px;font-size:10px;font-weight:900;opacity:.5;cursor:pointer;padding:0 2px;line-height:1;border-radius:2px;flex-shrink:0;pointer-events:all}
.chip-del:hover{opacity:1;background:rgba(0,0,0,.2)}
#palbar.band-hidden{max-height:0;border-bottom:none}
#topbar .top-selbox{margin-left:2px}
#topbar .top-legend{margin-left:0}
#topbar .clear-sel{padding:1px 5px}


/* TABS */
#tabbar{display:flex;padding:4px 10px 0;gap:4px;background:var(--bg);border-bottom:2px solid var(--brd2);flex-wrap:wrap;align-items:flex-end}
.tab-label{align-self:center;font-size:9px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:0 4px 3px 8px;opacity:.75}
.tab-label:first-child{margin-left:0}
.tab.prof-tab{padding:3px 8px}
.tab.level-tab{padding:3px 8px;border-color:rgba(0,0,0,.04);background:rgba(255,255,255,.35)}
.tab.level-tab.on{background:var(--surf)}
.tab{padding:3px 12px;border-radius:4px 4px 0 0;font-size:11px;font-weight:500;cursor:pointer;border:1px solid transparent;color:var(--mut)}
.tab:hover{background:var(--surf)}
.tab.on{background:var(--surf);border-color:var(--brd2);border-bottom-color:var(--surf);color:var(--txt);font-weight:600;margin-bottom:-2px}
.tbadge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--brd2);color:var(--mut);font-size:8px;font-weight:700;margin-left:3px}
.tab.on .tbadge{background:var(--hdr);color:#fff}

/* PANELS */
.panel{display:none}.panel.on{display:block}
.scroll-outer{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 96px);scrollbar-gutter:stable both-edges}

/* TABLE */
table.grid{border-collapse:collapse;table-layout:fixed;width:var(--GRIDW);min-width:var(--GRIDW);max-width:var(--GRIDW)}
table.grid col.col-lbl{width:var(--LW);min-width:var(--LW);max-width:var(--LW)}
table.grid col.col-day{width:var(--WW);min-width:var(--WW);max-width:var(--WW)}
table.grid thead th{position:sticky;top:0;z-index:50;background:var(--hdr);color:var(--htxt);border:1px solid rgba(255,255,255,.06);white-space:nowrap}
th.th-lbl{width:var(--LW);min-width:var(--LW);text-align:left;padding:0 5px;font-size:8px;position:sticky!important;left:0;z-index:65!important;background:var(--hdr)!important}
th.th-mon{font-size:7px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:0;height:9px;line-height:1;background:#3a3935!important;border-color:rgba(255,255,255,.08)!important}
th.th-date{width:var(--WW);min-width:var(--WW);height:10px;font-size:8px;font-weight:700;text-align:center;padding:0;border-color:rgba(255,255,255,.10)!important;line-height:1}
th.th-date .date-num{display:inline;min-width:0;height:auto;border-radius:0;background:transparent;box-shadow:none}
th.th-mon.season-autumn,th.th-date.season-autumn{background:linear-gradient(135deg,#7c2d12,#c2410c)!important;color:#fff7ed!important}
th.th-mon.season-winter,th.th-date.season-winter{background:linear-gradient(135deg,#1e3a8a,#0f766e)!important;color:#eff6ff!important}
th.th-mon.season-spring,th.th-date.season-spring{background:linear-gradient(135deg,#15803d,#65a30d)!important;color:#f0fdf4!important}
th.th-mon.season-summer,th.th-date.season-summer{background:linear-gradient(135deg,#0369a1,#f59e0b)!important;color:#fff7ed!important}
th.th-date.is-vac{background:#3a3935!important;color:rgba(255,255,255,.22)!important}
th.th-date.is-ferie{background:#7f1d1d!important;color:#fee2e2!important;font-size:8px!important;padding:0!important;overflow:hidden}
td.td-w.is-ferie{background:#fee2e2;cursor:default!important;filter:none!important;border-color:#fca5a5}
tfoot tr th{position:sticky;bottom:0;z-index:50;background:#181714;color:#f8fafc;border:1px solid rgba(255,255,255,.14);font-size:8px;font-weight:800;text-align:center;padding:2px 0 3px;text-shadow:0 1px 1px rgba(0,0,0,.45)}
tfoot th.th-lbl-foot{position:sticky!important;left:0;z-index:65!important;background:#181714!important;font-size:8px;font-weight:800;color:#f8fafc;text-align:left;padding:0 6px}
tfoot th.is-vac{background:#2f2e2a!important;color:#f8fafc!important}
tfoot th.is-ferie{background:#4a241d!important;color:#f8fafc!important}

/* CELLS */
td.td-lbl{position:sticky;left:0;z-index:20;background:var(--surf);border-right:2px solid var(--brd2);border-bottom:1px solid var(--brd);width:var(--LW);min-width:var(--LW);padding:3px 6px;vertical-align:middle;height:var(--RH);display:flex;flex-direction:column;justify-content:center;gap:1px}
.lbl-prof{font-weight:800;font-size:11px}
.lbl-cl{font-size:10px;color:var(--mut)}
.lbl-day{font-size:8px;font-weight:600;padding:1px 4px;border-radius:2px;margin-left:4px}
.lbl-h{font-size:10px;font-weight:600;color:#555;font-style:normal}
.row-meta{display:flex;align-items:center;gap:4px;margin-top:2px}.row-main{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}.row-hour{display:inline-block}

td.td-w{height:var(--RH);width:var(--WW);min-width:var(--WW);max-width:var(--WW);border:1px solid var(--brd);padding:0;position:relative;vertical-align:middle;text-align:center;overflow:hidden;cursor:default}
td.td-w[colspan]{max-width:none}
td.td-w.editable{cursor:default}
td.td-w.editable:hover{filter:brightness(.94)}
td.td-w.is-vac{background:var(--vac);cursor:default!important;filter:none!important}
td.td-w.is-ferie{background:#fee2e2;cursor:default!important;filter:none!important;border-top-color:#fee2e2;border-bottom-color:#fee2e2}
td.td-w.is-sf{background:repeating-linear-gradient(-45deg,#a9a69d,#a9a69d 3px,#cac7bf 3px,#cac7bf 6px);cursor:default!important;filter:none!important}
td.td-w.is-sp{background:repeating-linear-gradient(-45deg,#fde68a,#fde68a 3px,#fff7cc 3px,#fff7cc 6px)}
td.td-w.is-empty{background:#fff}
tr.voie-gt td.td-lbl{background:var(--gt-row);border-left:3px solid var(--gt-brd)}
tr.voie-pro td.td-lbl{background:var(--pro-row);border-left:3px solid var(--pro-brd)}
tr.voie-gt td.td-w.is-empty{background:var(--gt-cell)}
tr.voie-pro td.td-w.is-empty{background:var(--pro-cell)}
.class-ico{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;margin-right:2px;border-radius:50%;font-size:10px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);padding:0 2px;line-height:1}
.voie-tag{font-size:6.5px;font-weight:900;border-radius:6px;padding:1px 3px;margin-left:2px;letter-spacing:.03em}
tr.voie-gt .voie-tag{background:#bae6fd;color:#075985}
tr.voie-pro .voie-tag{background:#fed7aa;color:#9a3412}
.cyc-card{height:100%;width:100%;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 2px;pointer-events:none}
.cyc-icon{width:15px;height:15px;min-width:15px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.24);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);font-size:10px;line-height:1}
.cyc-info{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden}
.cyc-label{font-size:8px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px;line-height:1.08;display:block;pointer-events:none}
.cyc-meta{display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap;line-height:1;pointer-events:none}
.meta-pill{font-size:6px;font-weight:800;line-height:1;border-radius:3px;padding:1px 3px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.18)}
.sp-label{position:absolute;left:1px;right:1px;bottom:1px;font-size:6.5px;font-weight:800;color:#5a3a00;background:rgba(255,255,255,.74);display:block;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;border-radius:4px}
.role-strip{position:absolute;left:1px;right:1px;bottom:1px;display:grid;grid-template-columns:repeat(var(--role-cols,1),1fr);gap:1px;pointer-events:none;z-index:2}
.role-slot{min-width:0;display:flex;align-items:center;justify-content:center}
.role-mini{display:inline-flex;align-items:center;justify-content:center;gap:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:50%;padding:1px 2px;font-size:7px;font-weight:900;background:rgba(255,255,255,.88);color:#3b2d0b;box-shadow:0 1px 2px rgba(0,0,0,.12);border:1px solid rgba(120,89,0,.16)}
.role-mini.role-vidange{border-radius:4px;color:#991b1b;min-width:14px;border-color:rgba(153,27,27,.35);position:relative;font-family:Arial,sans-serif}
.role-mini.role-vidange::after{content:'';position:absolute;left:2px;right:2px;top:50%;height:2px;background:#dc2626;transform:rotate(-32deg);border-radius:2px}
.role-mini.role-pro{border-radius:4px;min-width:20px;padding:1px 3px;background:rgba(255,255,255,.92);color:#9a3412;border-color:rgba(154,52,18,.25);font-size:6px;letter-spacing:.02em}
.role-list{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow:auto;padding:6px;border:1px solid var(--brd);border-radius:5px;background:#faf9f6}
.role-help{font-size:10px;line-height:1.35;color:#5f5341;background:#fff8e1;border:1px solid #f3df9a;border-radius:5px;padding:5px 7px;margin-bottom:6px}
.role-row{display:grid;grid-template-columns:38px 54px 1fr;gap:6px;align-items:center;font-size:10px}
.role-no{font-weight:800;color:#111;background:#ece7dc;border-radius:10px;text-align:center;padding:2px 4px}
.role-date{color:var(--mut);font-weight:600}.lesson-role{font-size:10px;padding:3px 5px;border-radius:4px;border:1px solid var(--brd2);background:#fff;color:var(--txt)}
.term-note{font-size:10px;color:#7c2d12;background:#ffedd5;border:1px solid #fed7aa;border-radius:5px;padding:5px 7px;margin-top:5px}



/* REPÈRES VISUELS */
tbody tr:hover td.td-lbl{filter:brightness(.96)}
tbody tr:hover td.td-w:not(.is-vac):not(.is-ferie):not(.is-sf){box-shadow:inset 0 0 0 1px rgba(35,34,31,.18)}
td.td-w.editable:hover::after{content:'+';position:absolute;inset:2px;border:1px dashed rgba(0,0,0,.22);border-radius:2px;color:rgba(0,0,0,.28);font-size:10px;display:flex;align-items:center;justify-content:center;pointer-events:none}
td.td-w[data-has-cyc='1']:hover::after{content:'préciser';font-size:8px;text-transform:uppercase;letter-spacing:.04em;background:rgba(255,255,255,.2)}
body.role-mode td.td-w[data-has-cyc='1']:hover::after{content:'préciser';font-size:9px;text-transform:uppercase;letter-spacing:.05em;background:rgba(252,211,77,.36);color:#3b2d0b;border-color:rgba(120,89,0,.25)}
body.compact .cyc-label,body.comfort .cyc-label{font-size:8px}body.compact .cyc-icon,body.comfort .cyc-icon{width:15px;height:15px;min-width:15px;font-size:10px}body.compact .meta-pill,body.comfort .meta-pill{font-size:6px;padding:1px 2px}body.compact .lbl-day,body.comfort .lbl-day{display:none}body.compact .role-mini,body.comfort .role-mini{font-size:7px;padding:1px 2px;max-width:20px}


.ferie-cell-label{display:none}
.pfmp-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;letter-spacing:.08em;color:#333;opacity:.38;pointer-events:none;text-transform:uppercase}
.partial-block-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:7px;font-weight:900;color:#5a3a00;line-height:1.05;pointer-events:none}
.partial-block-label small{font-size:6.5px;font-weight:800;opacity:.78}
.view-title{font-size:11px;font-weight:800;color:#2e2d29;padding:5px 10px 2px;position:sticky;left:0;z-index:5}.view-section{margin:0 8px 7px 0}.view-section h3{font-size:9px;font-weight:800;color:#4b4942;padding:3px 0 2px;position:sticky;left:0;z-index:4}.empty-view{padding:10px;color:var(--mut);font-weight:600}
tfoot.hidden-weeks{display:none}
#signature{position:fixed;right:10px;bottom:7px;z-index:950;font-size:10px;font-weight:800;color:rgba(35,34,31,.66);background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.08);border-radius:999px;padding:4px 9px;box-shadow:0 2px 8px rgba(0,0,0,.10);backdrop-filter:blur(4px)}
.admin-note{font-size:11px;color:var(--mut);line-height:1.45;background:var(--bg);border:1px solid var(--brd);border-radius:6px;padding:8px 10px}


/* PLEIN ÉCRAN : la grille utilise toute la largeur et presque toute la hauteur */
body.fullscreen-mode{--LW:185px;--WW:calc((100vw - 168px)/44);--GRIDW:calc(100vw - 20px)}
body.fullscreen-mode #topbar{padding:2px 8px;gap:6px}
body.fullscreen-mode #palbody{padding:3px 8px;gap:4px}
body.fullscreen-mode #tabbar{padding:3px 8px 0;gap:3px}
body.fullscreen-mode .scroll-outer{max-height:calc(100vh - 76px)}
body.fullscreen-mode .view-title{display:none}
body.fullscreen-mode .view-section{margin-right:4px;margin-bottom:5px}
body.fullscreen-mode .view-section h3{padding:2px 0 1px}

/* CONFLICT TOAST */
#conflict-toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:8px 18px;border-radius:6px;font-size:12px;font-weight:500;z-index:800;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#conflict-toast.show{opacity:1}
#conflict-toast.warn{background:#b45309}
#conflict-toast.ok{background:#047857}

/* MODAL */

<script>
'use strict';

// ══ CALENDRIER ══
function isoMon(y,w){const j4=new Date(y,0,4),dw=j4.getDay()||7,r=new Date(j4);r.setDate(j4.getDate()-dw+1+(w-1)*7);return r;}
function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function dKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function pDMY(s){const[dd,mm,yy]=s.split('/');const y=+yy<100?2000+(+yy):+yy;return new Date(y,+mm-1,+dd);}
function fmtD(d){return`${d.getDate()}`;}
function fmtDM(d){return`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;}
function seasonOf(d){const m=d.getMonth()+1;if(m===12||m<=2)return'winter';if(m>=3&&m<=5)return'spring';if(m>=6&&m<=8)return'summer';return'autumn';}
function seasonIcon(s){return{autumn:'🍂',winter:'❄️',spring:'🌿',summer:'☀️'}[s]||'';}

const VACS=[
  {d:new Date(2026,9,17),f:new Date(2026,10,1)},
  {d:new Date(2026,11,19),f:new Date(2027,0,3)},
  {d:new Date(2027,1,20),f:new Date(2027,2,7)},
  {d:new Date(2027,3,17),f:new Date(2027,4,2)},
  {d:new Date(2027,4,5),f:new Date(2027,4,9)},
  {d:new Date(2027,6,3),f:new Date(2027,8,1)},
];
const FERIES={'2026-11-11':'Armistice','2027-03-29':'Pâques','2027-04-29':'Ascension','2027-05-17':'Pentecôte'};
function isVac(d){return VACS.some(v=>d>=v.d&&d<=v.f);}
function ferieL(d){return FERIES[dKey(d)]||null;}

const ALL_WK=[];
for(let w=36;w<=52;w++){const m=isoMon(2026,w);ALL_WK.push({w,mon:m});}
for(let w=1;w<=27;w++){const m=isoMon(2027,w);ALL_WK.push({w,mon:m});}

function buildSlots(di){
  return ALL_WK.map((wk,wi)=>{
    const date=addD(wk.mon,di);
    return{wi,date,vac:isVac(date),ferie:ferieL(date),wk};
  });
}
function mthSpans(slots){
  const sp=[];let cur=null,cnt=0,first=null;
  slots.forEach(s=>{
    const l=s.date.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});
    if(l!==cur){if(cur)sp.push({l:cur,n:cnt,d:first});cur=l;cnt=1;first=s.date;}else cnt++;
  });
  if(cur)sp.push({l:cur,n:cnt,d:first});return sp;
}

// ══ PFMP ══
const PF_FULL={
  'CAP1 EL':[{f:pDMY('04/01/27'),t:pDMY('22/01/27')},{f:pDMY('07/06/27'),t:pDMY('02/07/27')}],
  'CAP2 EL':[{f:pDMY('30/11/26'),t:pDMY('18/12/26')},{f:pDMY('03/05/27'),t:pDMY('28/05/27')}],
  '2 TNE1':[{f:pDMY('04/01/27'),t:pDMY('22/01/27')},{f:pDMY('14/06/27'),t:pDMY('02/07/27')}],
  '2 TNE2':[{f:pDMY('04/01/27'),t:pDMY('22/01/27')},{f:pDMY('14/06/27'),t:pDMY('02/07/27')}],
  '2 TNE3':[{f:pDMY('04/01/27'),t:pDMY('22/01/27')},{f:pDMY('14/06/27'),t:pDMY('02/07/27')}],
  'CAP2 MA g1':[{f:pDMY('28/09/26'),t:pDMY('16/10/26')},{f:pDMY('03/05/27'),t:pDMY('21/05/27')}],
  'CAP2 MA g2':[{f:pDMY('28/09/26'),t:pDMY('16/10/26')},{f:pDMY('03/05/27'),t:pDMY('21/05/27')}],
  'CAP2 MB g2':[{f:pDMY('28/09/26'),t:pDMY('16/10/26')},{f:pDMY('03/05/27'),t:pDMY('21/05/27')}],
  '1 ETE':[{f:pDMY('23/11/26'),t:pDMY('18/12/26')},{f:pDMY('31/05/27'),t:pDMY('02/07/27')}],
  'T ETE':[{f:pDMY('28/09/26'),t:pDMY('16/10/26')},{f:pDMY('01/02/27'),t:pDMY('19/02/27')}],
  '1 CIEL':[{f:pDMY('23/11/26'),t:pDMY('18/12/26')},{f:pDMY('31/05/27'),t:pDMY('02/07/27')}],
  'T CIEL':[{f:pDMY('28/09/26'),t:pDMY('16/10/26')},{f:pDMY('22/03/27'),t:pDMY('09/04/27')}],
  '1 MELEC':[{f:pDMY('25/01/27'),t:pDMY('19/02/27')},{f:pDMY('31/05/27'),t:pDMY('02/07/27')}],
  'T MELEC':[{f:pDMY('28/09/26'),t:pDMY('16/10/26')},{f:pDMY('22/03/27'),t:pDMY('09/04/27')}],
  'T MVCR':[{f:pDMY('28/09/26'),t:pDMY('16/10/26')},{f:pDMY('08/03/27'),t:pDMY('26/03/27')}],
  'T MVCC':[{f:pDMY('28/09/26'),t:pDMY('16/10/26')},{f:pDMY('08/03/27'),t:pDMY('26/03/27')}],
};
const PF_PART={
  // Regroupements CAP : les MA/MB et les C n'ont pas toujours les mêmes périodes.
  'CAP1 MA g1':[
    {f:pDMY('25/01/27'),t:pDMY('12/02/27'),who:'CAP1MA',course:'CAP1C'},
    {f:pDMY('22/03/27'),t:pDMY('09/04/27'),who:'CAP1C',course:'CAP1MA'},
    {f:pDMY('14/06/27'),t:pDMY('02/07/27'),who:'CAP1MA + CAP1C',course:'aucun groupe',full:true}
  ],
  'CAP1 MA g2':[
    {f:pDMY('25/01/27'),t:pDMY('12/02/27'),who:'CAP1MB',course:'CAP1C'},
    {f:pDMY('22/03/27'),t:pDMY('09/04/27'),who:'CAP1C',course:'CAP1MB'},
    {f:pDMY('14/06/27'),t:pDMY('02/07/27'),who:'CAP1MB + CAP1C',course:'aucun groupe',full:true}
  ],
  // Regroupements 1ères : périodes MV et CPA/CAV différentes, avec chevauchement fin novembre.
  '1 CPA-MV1':[
    {f:pDMY('02/11/26'),t:pDMY('22/11/26'),who:'1MV1',course:'1CPA'},
    {f:pDMY('23/11/26'),t:pDMY('27/11/26'),who:'1MV1 + 1CPA',course:'aucun groupe',full:true},
    {f:pDMY('28/11/26'),t:pDMY('18/12/26'),who:'1CPA',course:'1MV1'},
    {f:pDMY('07/06/27'),t:pDMY('02/07/27'),who:'1CPA + 1MV1',course:'aucun groupe',full:true}
  ],
  '1 CAV-MV2':[
    {f:pDMY('02/11/26'),t:pDMY('22/11/26'),who:'1MV2',course:'1CAV'},
    {f:pDMY('23/11/26'),t:pDMY('27/11/26'),who:'1MV2 + 1CAV',course:'aucun groupe',full:true},
    {f:pDMY('28/11/26'),t:pDMY('18/12/26'),who:'1CAV',course:'1MV2'},
    {f:pDMY('07/06/27'),t:pDMY('02/07/27'),who:'1CAV + 1MV2',course:'aucun groupe',full:true}
  ],
  // Regroupements 2des : les MV partent en janvier, les CPA/CAV fin janvier-février.
  '2 CPA-MV1':[
    {f:pDMY('04/01/27'),t:pDMY('22/01/27'),who:'2MV1',course:'2CPA'},
    {f:pDMY('25/01/27'),t:pDMY('12/02/27'),who:'2CPA',course:'2MV1'},
    {f:pDMY('14/06/27'),t:pDMY('02/07/27'),who:'2CPA + 2MV1',course:'aucun groupe',full:true}
  ],
  '2 CPA-MV2':[
    {f:pDMY('04/01/27'),t:pDMY('22/01/27'),who:'2MV2',course:'2CPA'},
    {f:pDMY('25/01/27'),t:pDMY('12/02/27'),who:'2CPA',course:'2MV2'},
    {f:pDMY('14/06/27'),t:pDMY('02/07/27'),who:'2CPA + 2MV2',course:'aucun groupe',full:true}
  ],
  '2 CAV-MV1':[
    {f:pDMY('04/01/27'),t:pDMY('22/01/27'),who:'2MV1',course:'2CAV'},
    {f:pDMY('25/01/27'),t:pDMY('12/02/27'),who:'2CAV',course:'2MV1'},
    {f:pDMY('14/06/27'),t:pDMY('02/07/27'),who:'2CAV + 2MV1',course:'aucun groupe',full:true}
  ],
};
function stageInfo(cl,date){
  const full=(PF_FULL[cl]||[]).find(p=>date>=p.f&&date<=p.t);
  if(full)return{type:'full',who:'tous',course:'aucun groupe'};
  const p=(PF_PART[cl]||[]).find(p=>date>=p.f&&date<=p.t);
  if(!p)return{type:'none'};
  if(p.full||String(p.who).toLowerCase()==='tous')return{type:'full',who:p.who||'tous',course:p.course||'aucun groupe'};
  return{type:'part',who:p.who,course:p.course||partialCourseLabel(cl,p.who)};
}
function partialCourseLabel(cl,who,course){
  if(course)return course;
  if(!who)return cl;
  if(String(who).toLowerCase()==='tous')return 'aucun groupe';
  return cl;

// Parse "8h30–10h" → {s:510, e:600} en minutes
function parseH(str){
  const toMin=s=>{s=s.trim();const m=s.match(/^(\d+)h(\d+)?$/);return m?+m[1]*60+(m[2]?+m[2]:0):0;};
  const p=str.split('–');return{s:toMin(p[0]),e:toMin(p[1])};
}
function rowById(rowId){for(const d of DAYS)for(const r of d.rows)if(r.id===rowId)return r;return null;}
function rowDayIndex(rowId){for(let di=0;di<DAYS.length;di++)if(DAYS[di].rows.some(r=>r.id===rowId))return di;return -1;}
function overlaps(idA,idB){const ra=rowById(idA),rb=rowById(idB);const a=ra?parseH(ra.h):null,b=rb?parseH(rb.h):null;return a&&b&&a.s<b.e&&a.e>b.s;}

function findConflict(di,si,loc,exceptRowId){
  if(!EXCL.has(loc))return null;
  const thisRow=DAYS[di].rows.find(r=>r.id===exceptRowId);
  const thisCl=thisRow?thisRow.cl:'';
  for(const row of DAYS[di].rows){
    if(row.id===exceptRowId)continue;
    const cyc=(cycles[row.id]||{})[si];
    if(cyc&&cyc.loc===loc){
      if(is3eCAP(thisCl)&&is3eCAP(row.cl))continue;
      if(overlaps(exceptRowId,row.id))return row;
    }
  }
  return null;
}

}

function slotIsTeaching(rowId,di,si){
  const sl=DAY_SLOTS[di]?.[si];if(!sl||sl.vac||sl.ferie)return false;
  if(stageInfo(findCl(rowId),sl.date).type==='full')return false;
  return true;
}
function sameApsaAt(rowId,si,n){return !!((cycles[rowId]||{})[si]&&((cycles[rowId]||{})[si]).n===n);}
function cycleInfo(rowId,di,si){
  const rc=cycles[rowId]||{};const base=rc[si];if(!base)return null;
  const n=base.n;let left=si,right=si,j=si-1;
  while(j>=0){if(sameApsaAt(rowId,j,n)){left=j;j--;continue;}if(!slotIsTeaching(rowId,di,j)){left=j;j--;continue;}break;}
  j=si+1;
  while(j<DAY_SLOTS[di].length){if(sameApsaAt(rowId,j,n)){right=j;j++;continue;}if(!slotIsTeaching(rowId,di,j)){right=j;j++;continue;}break;}
  const lessons=[];for(let k=left;k<=right;k++)if(sameApsaAt(rowId,k,n))lessons.push(k);
  const pos=lessons.indexOf(si);
  return{rowId,di,n,left,right,lessons,total:lessons.length,pos:pos+1,base};
}
function segmentMeta(rowId,di,si,span){
  const info=cycleInfo(rowId,di,si);if(!info)return null;
  const seg=[];for(let k=si;k<si+span;k++)if(sameApsaAt(rowId,k,info.n))seg.push(k);
  const a=info.lessons.indexOf(seg[0])+1,b=info.lessons.indexOf(seg[seg.length-1])+1;
  return{...info,seg,startNo:a,endNo:b};
}
function lessonLabel(meta){if(!meta)return'';return meta.startNo===meta.endNo?`L${meta.startNo}/${meta.total}`:`L${meta.startNo}-${meta.endNo}/${meta.total}`;}
function roleBadges(meta){
  if(!meta)return'';const rc=cycles[meta.rowId]||{};
  let hasRole=false;
  const slots=meta.seg.map(si=>{
    const r=roleInfo(rc[si]?.role);const no=meta.lessons.indexOf(si)+1;
    if(!r.v)return `<span class="role-slot"></span>`;
    hasRole=true;
    return `<span class="role-slot">${roleMiniHtml(r,no)}</span>`;
  });
  return hasRole?`<div class="role-strip" style="--role-cols:${Math.max(1,meta.seg.length)}">${slots.join('')}</div>`:'';
}
function displayCycleDates(info){
  const slots=DAY_SLOTS[info.di];const a=slots[info.lessons[0]]?.date,b=slots[info.lessons[info.lessons.length-1]]?.date;
  return a&&b?`${fmtDM(a)} → ${fmtDM(b)}`:'';
}
function groupKeysForClass(cl){
  let s=classKey(cl);
  const keys=new Set([s]);
  let m;
  if((m=s.match(/^2DE\s+(\d)$/))){
    const n=+m[1];keys.add('2DE '+n);if(n>=1&&n<=4)keys.add('2DE GR1234');if(n>=5&&n<=8)keys.add('2DE GR5678');
  }
  if(/^2DE\s+GR1234$/.test(s)){['1','2','3','4'].forEach(n=>keys.add('2DE '+n));}
  if(/^2DE\s+GR5678$/.test(s)){['5','6','7','8'].forEach(n=>keys.add('2DE '+n));}
  if((m=s.match(/^TERM\s+GR(\d)$/)))keys.add('TERM GR '+m[1]);
  if((m=s.match(/^1ERE\s+GT\s+GR(\d)$/)))keys.add('1ERE GT GR '+m[1]);
  if((m=s.match(/^3E\s+DP\s+GR\s+([AB])$/)))keys.add('3E DP GR '+m[1]);
  // Groupes composites : on ajoute les sous-groupes qui peuvent être vus par un autre enseignant.
  if(/^CAP1\s+MA\s+G1$/.test(s)){keys.add('CAP1MA');keys.add('CAP1C');}
  if(/^CAP1\s+MA\s+G2$/.test(s)){keys.add('CAP1MB');keys.add('CAP1C');}
  if(/^CAP2\s+MA\s+G1$/.test(s)){keys.add('CAP2MA');keys.add('CAP2C');}
  if(/^CAP2\s+MA\s+G2$/.test(s)||/^CAP2\s+MB\s+G2$/.test(s)){keys.add('CAP2MB');keys.add('CAP2C');}
  if(/^1\s+CPA-MV1$/.test(s)){keys.add('1CPA');keys.add('1MV1');}
  if(/^1\s+CAV-MV2$/.test(s)){keys.add('1CAV');keys.add('1MV2');}
  if(/^2\s+CPA-MV1$/.test(s)){keys.add('2CPA');keys.add('2MV1');}
  if(/^2\s+CPA-MV2$/.test(s)){keys.add('2CPA');keys.add('2MV2');}
  if(/^2\s+CAV-MV1$/.test(s)){keys.add('2CAV');keys.add('2MV1');}
  (ADMIN_GROUPS[s]||[]).forEach(k=>keys.add(classKey(k)));
  // Si deux classes appartiennent au même regroupement personnalisé, elles se reconnaissent aussi entre elles.
  Object.entries(ADMIN_GROUPS||{}).forEach(([k,arr])=>{if(k===s||(arr||[]).map(classKey).includes(s)){keys.add(k);(arr||[]).forEach(x=>keys.add(classKey(x)));}});
  return [...keys];
}
function classGroupsOverlap(a,b){
  const A=new Set(groupKeysForClass(a));
  return groupKeysForClass(b).some(k=>A.has(k));
}
function firstSameApsaForClass(rowId,apsaName,exclude={}){
  const currentCl=findCl(rowId);
  for(const day of DAYS){
    for(const row of day.rows){
      if(!classGroupsOverlap(currentCl,row.cl))continue;
      const rc=cycles[row.id]||{};
      const hit=Object.keys(rc).map(Number).sort((a,b)=>a-b).find(si=>{
        if(rc[si]?.n!==apsaName)return false;
        if(exclude.rowId===row.id&&si>=exclude.start&&si<=exclude.end)return false;
        return true;
      });
      if(hit!==undefined){
        const slot=DAY_SLOTS[day.di]?.[hit];
        return {row,day,si:hit,slot};
      }
    }
  }
  return null;
}
function warnDuplicateApsa(rowId,apsaName,exclude={}){
  // Les classes voie GT ont 2h/sem = 1 seul créneau → pas d'alerte doublon inter-classes
  const thisRow = rowById(rowId);
  if(thisRow && voie(thisRow.cl)==='GT') return false;
  const hit=firstSameApsaForClass(rowId,apsaName,exclude);
  if(hit){
    // Ne pas alerter si la classe cible est GT (elle ne peut pas avoir le même groupe)
    if(voie(hit.row.cl)==='GT') return false;
    const wk=hit.slot?.wk?.w?`semaine ${hit.slot.wk.w}`:'';
    showWarning(`⚠️ ${apsaName} déjà programmée avec ${hit.row.cl} (${hit.day.name} S${wk}). Alerte non bloquante.`);
    return true;
  }
  return false;
}

function levelKey(cl){
  const s=normClass(cl);
  if(/^CAP\d?/i.test(s))return 'CAP';
  if(/^2de\b/i.test(s))return '2GT';
  if(/^1ere GT\b/i.test(s))return '1GT';
  if(/^Term gr\d+/i.test(s))return 'TGT';
  if(/^1\b/i.test(s)&&voie(cl)==='PRO')return '1PRO';
  if(/^2\b/i.test(s)&&voie(cl)==='PRO')return '2PRO';
  if(/^T\b/i.test(s)&&voie(cl)==='PRO')return 'TPRO';
  return null;
}

  const s=normClass(cl);
  const m2=s.match(/^(2de)\s*(?:gr)?\s*(\d+)/i);if(m2)return '2de '+m2[2].padStart(2,'0');
  const m1=s.match(/^(1ere GT)\s*gr\s*(\d+)/i);if(m1)return '1GT '+m1[2].padStart(2,'0');
  const mt=s.match(/^(Term)\s*gr\s*(\d+)/i);if(mt)return 'TGT '+mt[2].padStart(2,'0');
  const m3=s.match(/^(3e DP)\s*gr\s*([AB])/i);if(m3)return '3DP '+m3[2];
  return s;
}
function rowDisplaySort(a,b){
  const ah=parseH(a.h),bh=parseH(b.h);
  if(ah.s!==bh.s)return ah.s-bh.s;
  // Les 3e sont regroupées ensemble (priorité haute dans le tri)
  const a3=/^3e/i.test(normClass(a.cl)), b3=/^3e/i.test(normClass(b.cl));
  if(a3&&!b3)return -1;
  if(!a3&&b3)return 1;
  const ca=classBaseForSort(a.cl),cb=classBaseForSort(b.cl);
  const cv=ca.localeCompare(cb,'fr',{numeric:true});
  if(cv)return cv;
  return profDisplayName(a.prof).localeCompare(profDisplayName(b.prof),'fr',{numeric:true});
}

function buildRow(row,di,slots,opts={}){
  const tr=document.createElement('tr');tr.dataset.rowId=row.id;tr.dataset.di=di;
  const pc=PC[row.prof]||PC[profDisplayName(row.prof)]||'#333',pb=PB[row.prof]||PB[profDisplayName(row.prof)]||'#eee';
  const v=voie(row.cl);
  tr.classList.add(v==='GT'?'voie-gt':'voie-pro');
  const lbl=document.createElement('td');lbl.className='td-lbl';
  lbl.innerHTML=`<div style="display:flex;align-items:center;gap:3px;overflow:hidden;white-space:nowrap;min-width:0"><span class="lbl-prof" style="color:${pc};background:${pb};border-radius:6px;padding:1px 5px;flex-shrink:0">${esc(profDisplayName(row.prof))}</span><span class="class-ico" title="${esc(voieLabel(row.cl))}" style="flex-shrink:0">${classIcon(row.cl)}</span><span class="lbl-cl" style="overflow:hidden;text-overflow:ellipsis;min-width:0">${esc(row.cl)}</span><span class="voie-tag" style="flex-shrink:0">${voieLabel(row.cl)}</span></div><div style="display:flex;align-items:center;margin-top:1px"><span class="lbl-h">⏱ ${row.h}</span></div>`;
  tr.appendChild(lbl);

  let si=0;
  while(si<slots.length){
    const s=slots[si];
    const rc=cycles[row.id]||{};
    const cyc=rc[si];

    const info=stageInfo(row.cl,s.date);
    if(s.vac){
      let span=1;while(si+span<slots.length&&slots[si+span].vac)span++;
      tr.appendChild(mkTd(row.id,di,si,'is-vac',span));si+=span;continue;
    }
    if(info.type==='full'){
      let span=1;
      while(si+span<slots.length){
        const ns=slots[si+span];
        if(ns.vac)break;
        if(stageInfo(row.cl,ns.date).type!=='full')break;
        span++;
      }
      const td=mkTd(row.id,di,si,'is-sf',span);td.title='PFMP — '+row.cl;td.innerHTML='<span class="pfmp-label">PFMP</span>';tr.appendChild(td);si+=span;continue;
    }
    if(info.type==='part'&&!cyc){
      const who=info.who;
      const stageCourse=info.course||partialCourseLabel(row.cl,who);
      let span=1;
      while(si+span<slots.length){
        const ns=slots[si+span];
        if(ns.vac)break;
        if((cycles[row.id]||{})[si+span])break;
        if(!samePartialStage(row.cl,ns.date,who,stageCourse))break;
        span++;
      }
      const cours=partialCourseLabel(row.cl,who,stageCourse);
      const td=mkTd(row.id,di,si,'is-sp editable',span);
      td.innerHTML=`<span class="partial-block-label"><span>PFMP partielle</span><small>Cours : ${esc(cours)}</small></span>`;
      td.title=`Stage partiel — ${esc(who)} en PFMP · En cours : ${esc(cours)}`;
      tr.appendChild(td);si+=span;continue;
    }
    if(s.ferie){
      const td=mkTd(row.id,di,si,'is-ferie',1);
      td.title=s.ferie;
      td.innerHTML='';
      tr.appendChild(td);si++;continue;
    }
    if(cyc){
      let span=1;
      const startStageKey=stageDisplayKey(row.cl,s.date);
      while(si+span<slots.length){
        const ns=slots[si+span];if(ns.vac||ns.ferie||stageInfo(row.cl,ns.date).type==='full')break;
        if(stageDisplayKey(row.cl,ns.date)!==startStageKey)break;
        const nc=rc[si+span];if(!nc||nc.n!==cyc.n)break;span++;
      }
      if(opts.apsaFilter&&!sameApsaName(cyc.n,opts.apsaFilter)){
        const td=mkTd(row.id,di,si,'is-othercyc',span);
        td.title=`Autre cycle masqué par le filtre : ${cyc.n}`;
        tr.appendChild(td);si+=span;continue;
      }
      const td=mkTd(row.id,di,si,'editable',span);
      td.dataset.hasCyc='1';
      td.style.background=cyc.c;td.style.borderColor='rgba(0,0,0,.1)';
      const t=txc(cyc.c);
      const meta=segmentMeta(row.id,di,si,span);
      const pnote=info.type==='part'?`<span class="sp-label" title="${esc(info.who)} en PFMP · En cours : ${esc(partialCourseLabel(row.cl,info.who,info.course))}">Cours : ${esc(partialCourseLabel(row.cl,info.who,info.course))}</span>`:'';
      td.innerHTML=`<div class="cyc-card" style="color:${t}"><span class="cyc-icon">${apsaIcon(cyc)}</span><span class="cyc-info"><span class="cyc-label">${esc(cyc.n)}</span><span class="cyc-meta"><span class="meta-pill">${lessonLabel(meta)}</span><span class="loc-pill" style="background:${LOC_COL[cyc.loc]||'#888'};color:#fff" title="${esc(cyc.loc)}">${esc(cyc.loc)}</span></span></span></div>`+
        roleBadges(meta)+pnote;
      td.title=`${cyc.ca} — ${cyc.n} [${cyc.loc}] · ${meta?meta.total:span} leçon(s) · ${lessonLabel(meta)} · clic sans APSA ou mode Préciser Cycle pour modifier`;
      tr.appendChild(td);si+=span;continue;
    }
    if(info.type==='part'){
      const cours=partialCourseLabel(row.cl,info.who,info.course);
      const td=mkTd(row.id,di,si,'is-sp editable',1);
      td.innerHTML=`<span class="partial-block-label"><span>PFMP partielle</span><small>Cours : ${esc(cours)}</small></span>`;
      td.title=`Stage partiel — ${esc(info.who)} en PFMP · En cours : ${esc(cours)}`;
      tr.appendChild(td);si++;continue;
    }
    const td=mkTd(row.id,di,si,'is-empty editable',1);
    tr.appendChild(td);si++;
  }
  return tr;
}

function mkTd(rowId,di,si,cls,span){
  const td=document.createElement('td');
  td.className='td-w'+(cls?' '+cls:'');
  td.dataset.rowId=rowId;td.dataset.di=di;td.dataset.si=si;
  if(span>1)td.colSpan=span;
  return td;
}

// ══ INTERACTIONS ══
// Règle absolue : on récupère la cellule via closest, on vérifie editable, puis on agit.
// Pas de listener document qui interfère avec selIdx.

function isEditable(td){
  return td&&td.classList.contains('editable');
}

function getCell(e){
  // e.target peut être un span enfant (cyc-label etc.) → on remonte au td
  return e.target.closest('td.td-w');
}

function onTbodyDown(e){
  const td=getCell(e);
  if(!td||!isEditable(td))return;
  e.preventDefault();

  const rowId=td.dataset.rowId;
  const si=+td.dataset.si;
  const di=+td.closest('table').dataset.di;
  const existing=(cycles[rowId]||{})[si];

  if(roleMode){
    if(existing)openModal(rowId,di,si);
    else showConflict('✍️ Mode Préciser Cycle : clique sur un cycle déjà créé');
    return;
  }

  // Pas d'APSA sélectionnée
  if(selIdx===null){
    if(existing){
      // Clic sur un cycle → modal modification/suppression, avec cycle continu malgré vacances/fériés
      openModal(rowId,di,si);
    } else {
      showConflict('👆 Sélectionnez d\'abord une APSA dans le bandeau');
    }
    return;
  }

  // APSA sélectionnée + clic sur même APSA → supprimer tout le cycle continu
  if(existing && existing.n===APSA[selIdx].n){
    const info=cycleInfo(rowId,di,si);
    if(info&&cycles[rowId])info.lessons.forEach(k=>delete cycles[rowId][k]);
    showConflict(`🗑 Cycle ${APSA[selIdx].n} supprimé`);
    refreshRow(rowId,di);updateBadge(di);saveLS();
    return;
  }

  // Poser le cycle (début d'un éventuel drag). Si la cellule fusionnée représente une PFMP partielle,
  // on prend toute sa largeur pour éviter de ne programmer que le premier lundi du bloc.
  const tdEnd=si+((td.colSpan||1)-1);
  isDrag=true;dragRowId=rowId;dragDi=di;dragStartSi=si;dragStartEndSi=tdEnd;dragWarnedDup=false;
  setCycleRange(rowId,di,si,tdEnd);
}

function onTbodyOver(e){
  const td=getCell(e);
  if(td&&td.title){showTip(e,td.title);}
  if(!isDrag||selIdx===null)return;
  if(!td||!isEditable(td))return;
  if(td.dataset.rowId!==dragRowId)return;

  const si=+td.dataset.si;
  const tdEnd=si+((td.colSpan||1)-1);
  const s=Math.min(dragStartSi,si),en=Math.max(dragStartEndSi||dragStartSi,tdEnd);
  const slots=DAY_SLOTS[dragDi];
  if(!dragWarnedDup&&warnDuplicateApsa(dragRowId,APSA[selIdx].n,{rowId:dragRowId,start:s,end:en}))dragWarnedDup=true;
  for(let i=s;i<=en;i++){
    const sl=slots[i];if(!sl||sl.vac||sl.ferie)continue;
    if(stageInfo(findCl(dragRowId),sl.date).type==='full')continue;
    const cf=findConflict(dragDi,i,APSA[selIdx].loc,dragRowId);
    if(cf)showConflict(`⚠️ Chevauchement ${APSA[selIdx].loc} avec ${cf.prof}·${cf.cl} S${sl.wk.w}`);
    if(!cycles[dragRowId])cycles[dragRowId]={};
    cycles[dragRowId][i]=makeCycleObj(APSA[selIdx],cycles[dragRowId][i]);
  }
  refreshRow(dragRowId,dragDi);updateBadge(dragDi);saveLS();
}

function onTbodyContext(e){
  const td=getCell(e);if(!td)return;
  const rowId=td.dataset.rowId,si=+td.dataset.si,di=+td.closest('table').dataset.di;
  if((cycles[rowId]||{})[si]){e.preventDefault();openModal(rowId,di,si);}
}
function onTbodyDblClick(e){
  const td=getCell(e);if(!td)return;
  const rowId=td.dataset.rowId,si=+td.dataset.si,di=+td.closest('table').dataset.di;
  if((cycles[rowId]||{})[si]){e.preventDefault();openModal(rowId,di,si);}
}

document.addEventListener('mouseup',()=>{isDrag=false;});

function setCycle(rowId,di,si,excludeRange){
  const slot=DAY_SLOTS[di][si];
  if(!slot||slot.vac||slot.ferie)return;
  if(stageInfo(findCl(rowId),slot.date).type==='full')return;
  if(!dragWarnedDup&&warnDuplicateApsa(rowId,APSA[selIdx].n,excludeRange||{rowId,start:si,end:si}))dragWarnedDup=true;
  const cf=findConflict(di,si,APSA[selIdx].loc,rowId);
  if(cf)showConflict(`⚠️ Chevauchement ${APSA[selIdx].loc} avec ${cf.prof}·${cf.cl} S${slot.wk.w}`);
  if(!cycles[rowId])cycles[rowId]={};
  cycles[rowId][si]=makeCycleObj(APSA[selIdx],cycles[rowId][si]);
}
function setCycleRange(rowId,di,start,end){
  const s=Math.min(start,end),en=Math.max(start,end);
  const exclude={rowId,start:s,end:en};
  for(let i=s;i<=en;i++)setCycle(rowId,di,i,exclude);
  refreshRow(rowId,di);updateBadge(di);saveLS();
}

function findCl(rowId){for(const d of DAYS)for(const r of d.rows)if(r.id===rowId)return r.cl;return'';}

function refreshRow(rowId,di){
  const day=DAYS[di];const row=day.rows.find(r=>r.id===rowId);if(!row)return;
  const matches=Array.from(document.querySelectorAll(`tr[data-row-id="${rowId}"]`));
  if(!matches.length)return;
  matches.forEach(old=>{
    const table=old.closest('table');
    const opts={};
    if(table?.dataset.apsaFilter)opts.apsaFilter=table.dataset.apsaFilter;
    old.parentNode.replaceChild(buildRow(row,di,DAY_SLOTS[di],opts),old);
  });
}

function updateBadge(di){
  // Les onglets restent sobres : aucun compteur quotidien de leçons affiché.
}
function rebuildAll(){buildTabs();}

// ══ MODAL edit cycle ══
let modalCtx=null;
function openModal(rowId,di,si){
  const info=cycleInfo(rowId,di,si);if(!info)return;
  const cyc=info.base;
  const slots=DAY_SLOTS[di];
  const row=DAYS[di].rows.find(r=>r.id===rowId);
  modalCtx={rowId,di,lessons:[...info.lessons]};
  const opts=APSA.map((a,i)=>`<option value="${i}" ${a.n===cyc.n?'selected':''}>${apsaIcon(a)} ${a.ca} [${a.loc}] — ${esc(a.n)}</option>`).join('');
  const roleRows=info.lessons.map((lessonSi,idx)=>{
    const d=slots[lessonSi].date;const saved=(cycles[rowId]||{})[lessonSi]?.role||'';
    return `<div class="role-row"><span class="role-no">L${idx+1}</span><span class="role-date">${fmtDM(d)}</span><select class="lesson-role" data-si="${lessonSi}">${roleOptions(saved)}</select></div>`;
  }).join('');
  document.getElementById('mo').innerHTML=`
    <h2>Préciser le Cycle</h2>
    <div class="mrow"><label>Prof · Classe</label><div class="mval">${esc(row?.prof)} · ${esc(row?.cl)}</div></div>
    <div class="mrow"><label>Période</label><div class="mval">${displayCycleDates(info)} · ${info.total} leçon(s) programmée(s)</div></div>
    <div class="mrow"><label>APSA</label><select id="msel">${opts}</select></div>
    <div class="mrow"><label>Rôle des leçons</label><div class="role-help">Chaque ligne correspond à une leçon réelle du cycle. La précision choisie s’affiche directement sous la bonne leçon dans le planning.</div><div class="role-list">${roleRows}</div>${isTerminale(row?.cl)?'<div class="term-note">Terminale : tu peux marquer une co-évaluation ou un rattrapage Bac sur la leçon concernée.</div>':''}</div>
    <div class="mbtns">
      <button class="bd" onclick="delCyc()">Supprimer le cycle</button>
      <button class="bn" onclick="closeMo()">Annuler</button>
      <button class="bc" onclick="saveMo()">Enregistrer</button>
    </div>`;
  document.getElementById('ov').classList.add('on');
}
function closeMo(){document.getElementById('ov').classList.remove('on');const mo=document.getElementById('mo');if(mo)mo.className='mo';modalCtx=null;}
function saveMo(){
  if(!modalCtx)return closeMo();
  const {rowId,di,lessons}=modalCtx;
  const i=+document.getElementById('msel').value;const a=APSA[i];
  const roleBySi={};document.querySelectorAll('.lesson-role').forEach(sel=>{roleBySi[sel.dataset.si]=sel.value||'';});
  if(!cycles[rowId])cycles[rowId]={};
  lessons.forEach(s=>{cycles[rowId][s]={n:a.n,ca:a.ca,loc:a.loc,c:a.c,role:roleBySi[s]||''};});
  refreshRow(rowId,di);closeMo();updateBadge(di);saveLS();
}
function delCyc(){
  if(!modalCtx)return closeMo();
  const {rowId,di,lessons}=modalCtx;
  if(cycles[rowId])lessons.forEach(s=>delete cycles[rowId][s]);
  refreshRow(rowId,di);closeMo();updateBadge(di);saveLS();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('ov').classList.contains('on'))closeMo();else clearSelection();hideTip();}});

loadLS();initDensity();syncLocUI();buildPal();buildTabs();updateSelectionUI();

// ══ STATISTIQUES ══
const STAT_PERIODS=[
  {label:'P1 rentrée→Toussaint', debut:new Date(2026,8,1),  fin:new Date(2026,9,16)},
  {label:'P2 Toussaint→Noël',    debut:new Date(2026,10,2), fin:new Date(2026,11,18)},
  {label:'P3 Noël→Hiver',        debut:new Date(2027,0,4),  fin:new Date(2027,1,19)},
  {label:'P4 Hiver→Printemps',   debut:new Date(2027,2,8),  fin:new Date(2027,3,16)},
  {label:'P5 Printemps→Ascension',debut:new Date(2027,4,3), fin:new Date(2027,4,4)},
  {label:'P6 Ascension→Été',     debut:new Date(2027,4,10), fin:new Date(2027,6,2)},
];

const DH_APSA_NAMES=['Demi-fond','Relais vitesse','Foot','Biathlon','Hand EXT','CED','CO','Football','Handball EXT'];

function isDH(cycName){
  return DH_APSA_NAMES.some(n=>cycName&&cycName.toLowerCase().includes(n.toLowerCase()))||
    (APSA.find(a=>a.n===cycName)?.loc==='DH')||false;
}

function getPeriodIdx(date){
  for(let i=0;i<STAT_PERIODS.length;i++){
    const p=STAT_PERIODS[i];
    if(date>=p.debut&&date<=p.fin)return i;
  }
  return -1;
}

function buildStats(){
  const profs=[...new Set(DAYS.flatMap(d=>d.rows.map(r=>r.prof)))].sort();
  const classes=[...new Set(DAYS.flatMap(d=>d.rows.map(r=>r.cl)))].sort();

  const dhByProf=profs.map(()=>STAT_PERIODS.map(()=>0));
  const dhByClass=classes.map(()=>STAT_PERIODS.map(()=>0));
  const totByProf=profs.map(()=>STAT_PERIODS.map(()=>0));   // total leçons effectuées
  const totByClass=classes.map(()=>STAT_PERIODS.map(()=>0));
  const apsaByProf={};
  const apsaByClass={};

  DAYS.forEach((day,di)=>{
    const slots=DAY_SLOTS[di];
    day.rows.forEach(row=>{
      const rc=cycles[row.id]||{};
      const pi=profs.indexOf(row.prof);
      const ci=classes.indexOf(row.cl);
      Object.entries(rc).forEach(([siStr,cyc])=>{
        const si=+siStr;
        const slot=slots[si];if(!slot||slot.vac||slot.ferie)return;
        const sInfo=stageInfo(row.cl,slot.date);
        if(sInfo.type==='full')return; // élèves absents → cours n'a pas lieu
        const pIdx=getPeriodIdx(slot.date);if(pIdx<0)return;
        // Compter dans le total leçons effectuées
        if(pi>=0)totByProf[pi][pIdx]++;
        if(ci>=0)totByClass[ci][pIdx]++;
        // Dehors ?
        const dh=isDH(cyc.n)||(cyc.loc==='DH');
        if(dh){
          if(pi>=0)dhByProf[pi][pIdx]++;
          if(ci>=0)dhByClass[ci][pIdx]++;
        }
        // APSA
        const an=cyc.n||'?';
        if(!apsaByProf[an])apsaByProf[an]={};
        if(!apsaByClass[an])apsaByClass[an]={};
        apsaByProf[an][pi]=(apsaByProf[an][pi]||0)+1;
        apsaByClass[an][ci]=(apsaByClass[an][ci]||0)+1;
      });
    });
  });

  // Fonction ratio DH/total
  function ratio(dh,tot){
    if(!tot)return'—';
    return Math.round(dh/tot*100)+'%';
  }

  let html='<div id="stats-wrap">';

  // ── Tableau 1 : leçons dehors par période × prof (avec ratio) ──
  html+=`<h3 class="stat-title">🌿 Leçons dehors — par période × prof <span style="font-size:10px;font-weight:400;color:var(--mut)">(DH / total leçons effectuées)</span></h3>`;
  html+=`<div class="stat-scroll"><table class="stat-table"><thead>
    <tr><th rowspan="2">Période</th>`;
  profs.forEach(p=>html+=`<th colspan="2">${esc(p)}</th>`);
  html+=`<th colspan="2">Total</th></tr><tr>`;
  profs.forEach(()=>html+=`<th class="sub-th">DH</th><th class="sub-th">%</th>`);
  html+=`<th class="sub-th">DH</th><th class="sub-th">%</th></tr></thead><tbody>`;
  STAT_PERIODS.forEach((per,pIdx)=>{
    const rowDH=profs.reduce((s,_,pi)=>s+dhByProf[pi][pIdx],0);
    const rowTot=profs.reduce((s,_,pi)=>s+totByProf[pi][pIdx],0);
    html+=`<tr><td class="period-lbl">${esc(per.label)}</td>`;
    profs.forEach((_,pi)=>{
      const dh=dhByProf[pi][pIdx],tot=totByProf[pi][pIdx];
      html+=`<td class="stat-cell${dh>0?' has-val':''}">${dh||'—'}</td>`;
      html+=`<td class="ratio-cell">${ratio(dh,tot)}</td>`;
    });
    html+=`<td class="total-col">${rowDH||'—'}</td><td class="ratio-cell bold">${ratio(rowDH,rowTot)}</td></tr>`;
  });
  // Ligne totaux
  html+=`<tr class="total-row"><td>Total année</td>`;
  profs.forEach((_,pi)=>{
    const dh=STAT_PERIODS.reduce((s,_,pIdx)=>s+dhByProf[pi][pIdx],0);
    const tot=STAT_PERIODS.reduce((s,_,pIdx)=>s+totByProf[pi][pIdx],0);
    html+=`<td class="total-col">${dh||'—'}</td><td class="ratio-cell bold">${ratio(dh,tot)}</td>`;
  });
  const gDH=profs.reduce((s,_,pi)=>s+STAT_PERIODS.reduce((s2,_,pIdx)=>s2+dhByProf[pi][pIdx],0),0);
  const gTot=profs.reduce((s,_,pi)=>s+STAT_PERIODS.reduce((s2,_,pIdx)=>s2+totByProf[pi][pIdx],0),0);
  html+=`<td class="total-col grand">${gDH}</td><td class="ratio-cell bold grand">${ratio(gDH,gTot)}</td></tr>`;
  html+=`</tbody></table></div>`;

  // ── Tableau 2 : APSA × prof (avec total et ratio DH) ──
  const apsaNames=Object.keys(apsaByProf).sort();
  html+=`<h3 class="stat-title" style="margin-top:18px">📊 Leçons par APSA × prof</h3>`;
  html+=`<div class="stat-scroll"><table class="stat-table"><thead><tr><th>APSA</th>`;
  profs.forEach(p=>html+=`<th>${esc(p)}</th>`);
  html+=`<th class="total-col">Total</th></tr></thead><tbody>`;
  apsaNames.forEach(an=>{
    const tot=profs.reduce((s,_,pi)=>s+(apsaByProf[an][pi]||0),0);
    if(tot===0)return;
    const apsa=APSA.find(a=>a.n===an);
    const col=apsa?.c||'#888';
    const dh2=isDH(an)||(apsa?.loc==='DH');
    html+=`<tr${dh2?' class="dh-row"':''}><td class="period-lbl"><span class="apsa-dot" style="background:${col}"></span>${esc(an)}</td>`;
    profs.forEach((_,pi)=>{
      const v=apsaByProf[an][pi]||0;
      html+=`<td class="stat-cell${v>0?' has-val':''}">${v||'—'}</td>`;
    });
    html+=`<td class="total-col">${tot}</td></tr>`;
  });
  html+=`</tbody></table></div>`;

  // ── Tableau 3 : APSA × classe ──
  html+=`<h3 class="stat-title" style="margin-top:18px">📊 Leçons par APSA × classe</h3>`;
  html+=`<div class="stat-scroll"><table class="stat-table"><thead><tr><th>APSA</th>`;
  classes.forEach(cl=>html+=`<th style="font-size:8px">${esc(cl)}</th>`);
  html+=`<th class="total-col">Total</th></tr></thead><tbody>`;
  apsaNames.forEach(an=>{
    const tot=classes.reduce((s,_,ci)=>s+(apsaByClass[an][ci]||0),0);
    if(tot===0)return;
    const apsa=APSA.find(a=>a.n===an);
    const col=apsa?.c||'#888';
    const dh2=isDH(an)||(apsa?.loc==='DH');
    html+=`<tr${dh2?' class="dh-row"':''}><td class="period-lbl"><span class="apsa-dot" style="background:${col}"></span>${esc(an)}</td>`;
    classes.forEach((_,ci)=>{
      const v=apsaByClass[an][ci]||0;
      html+=`<td class="stat-cell${v>0?' has-val':''}">${v||'—'}</td>`;
    });
    html+=`<td class="total-col">${tot}</td></tr>`;
  });
  html+=`</tbody></table></div></div>`;

  const wrap=document.getElementById('stats-panel');
  if(wrap)wrap.innerHTML=html;
}

function openStatsTab(){
  buildStats();
  const panel=document.getElementById('stats-panel');
  if(panel){panel.style.display='block';document.getElementById('stats-btn').style.background='rgba(147,197,253,.15)';}
}
function closeStatsTab(){
  const panel=document.getElementById('stats-panel');
  if(panel)panel.style.display='none';
  const btn=document.getElementById('stats-btn');
  if(btn)btn.style.background='';
}
function toggleStats(){
  const panel=document.getElementById('stats-panel');
  if(!panel)return;
  if(panel.style.display==='block'){closeStatsTab();}
  else{openStatsTab();}
}

</script>
<div id="stats-panel"></div>
